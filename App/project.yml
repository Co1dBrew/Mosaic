name: Mosaic
options:
  # 反向 DNS 前缀必须是**全局唯一**的。原来的 `com.mosaic` 太通用，
  # 在 Apple 的全局命名空间里已被占用 —— 免费的 Personal Team 注册不了它
  # （Xcode 报 `Failed Registering Bundle Identifier`）。
  bundleIdPrefix: com.qingdonggong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MosaicKit:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # 在 Xcode 里选的 Team **不会**保留 —— 这个工程是 xcodegen 生成的，
    # 下一次 `xcodegen generate` 就把选择冲掉了。填在这里才持久。
    # Team ID 怎么找：Xcode ▸ Settings ▸ Accounts ▸ 选中 Apple ID ▸
    # 下方 Team 一栏括号里的 10 位字符串。
    DEVELOPMENT_TEAM: 6TC3N788WT
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mosaic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mosaic
        excludes:
          - "Info.plist"
          - "Mosaic.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingdonggong.mosaic
        PRODUCT_NAME: Mosaic
        INFOPLIST_FILE: Mosaic/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mosaic/Mosaic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: MosaicKit
        product: MosaicKit
    scheme:
      testTargets:
        - MosaicTests
        - MosaicBench

  # 真机性能基准。**独立 target**：它只依赖内核，不用 `@testable`，
  # 所以 Release 构建不需要打开 ENABLE_TESTABILITY —— 那会改变符号可见性与优化，
  # 污染性能数字。MosaicTests 里的用例需要 @testable，因此两者不能共处一个 target。
  MosaicBench:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MosaicBench
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.qingdonggong.mosaic.bench
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Mosaic
      - package: MosaicKit
        product: MosaicKit

  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MosaicTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.qingdonggong.mosaic.tests
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Mosaic
      - package: MosaicKit
        product: MosaicKit

schemes:
  # 只包含 MosaicBench 的 scheme。`build-for-testing` 会编译 scheme 里**所有**
  # 测试 target，而 MosaicTests 需要 @testable（Release 下不可用），
  # 所以真机性能基准必须走自己的 scheme。
  MosaicBench:
    build:
      targets:
        Mosaic: [run, test]
        MosaicBench: [test]
    test:
      config: Release
      targets:
        - MosaicBench
    run:
      config: Release
