name: Mosaic
options:
  bundleIdPrefix: com.mosaic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MosaicKit:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mosaic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mosaic
        excludes:
          - "Info.plist"
          - "Mosaic.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaic.app
        PRODUCT_NAME: Mosaic
        INFOPLIST_FILE: Mosaic/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mosaic/Mosaic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - package: MosaicKit
        product: MosaicKit
    scheme:
      testTargets:
        - MosaicTests

  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MosaicTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaic.app.tests
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: Mosaic
      - package: MosaicKit
        product: MosaicKit
